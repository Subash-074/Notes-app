{% extends "learning_logs/base.html" %}

{% block header %}
  <div class="section-heading auth-heading">
    <p class="eyebrow">Topic</p>
    <h1>{{ topic }}</h1>
  </div>
{% endblock header %}

{% block content %}
  <div class="auth-card">
    <h2 class="form-title">Add a new entry</h2>
    <form action="{% url 'learning_logs:new_entry' topic.id %}" method="post" class="styled-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button name="submit" class="btn btn-primary">Add entry</button>
    </form>
  </div>
{% endblock content %}
