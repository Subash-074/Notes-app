{% extends "learning_logs/base.html" %}

{% block header %}
  <div class="section-heading auth-heading">
    <p class="eyebrow">Update</p>
    <h1>Edit the entry</h1>
  </div>
{% endblock header %}

{% block content %}
  <div class="auth-card">
    <form action="{% url 'learning_logs:edit_entry' entry.id %}" method="post" class="styled-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button name="submit" class="btn btn-primary">Save changes</button>
    </form>
  </div>
{% endblock content %}
