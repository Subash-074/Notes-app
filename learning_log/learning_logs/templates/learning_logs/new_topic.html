{% extends "learning_logs/base.html" %}

{% block header %}
  <div class="section-heading auth-heading">
    <p class="eyebrow">New idea</p>
    <h1>Add a new topic</h1>
  </div>
{% endblock header %}

{% block content %}
  <div class="auth-card">
    <form action="{% url 'learning_logs:new_topic' %}" method="post" class="styled-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button name="submit" class="btn btn-primary">Add topic</button>
    </form>
  </div>
{% endblock content %}
