{% extends "learning_logs/base.html" %}

{% block header %}
  <div class="section-heading auth-heading">
    <p class="eyebrow">Create your account</p>
    <h1>Register</h1>
  </div>
{% endblock header %}

{% block content %}
  <div class="auth-card">
    <form method="post" action="{% url 'users:register' %}" class="styled-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button name="submit" class="btn btn-primary">Create account</button>
      <input type="hidden" name="next" value="{% url 'learning_logs:index' %}" />
    </form>
  </div>
{% endblock content %}
